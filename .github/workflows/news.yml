name: مزامنة أخبار كفر الشيخ والعالم والرياضة

# يجلب خلاصات RSS عربية رسمية وأخبار محافظة كفر الشيخ من بوابتها الرسمية (وخبر NewsAPI
# إن كان NEWS_API_KEY مضبوطًا) ويكتب العناصر في جدول items بأقسام «أخبار كفر الشيخ» و
# «أخبار العالم» و«رياضة»، ثم ينشر data/sections/*.json في نفس التشغيل حتى تصل البطاقة
# إلى التطبيق دون انتظار ناشر مستقل.
# publish.yml يبقى كما هو (تعديلات اللوحة تنشره أيضًا)؛ هذا الملف يكتب items فقط
# والناشر يولّد الملفات، فلا مصدر تعديل ثاني.
#
# لماذا التتابع (RELAY_TOKEN)؟
# دورية GitHub على هذا المستودع متأخرة جدًا عمليًا: publish.yml مجدول كل خمس دقائق
# ولم يُشغَّل جدوليًا سوى ٧ مرات في يومين، وآخر تشغيل جدولي جاء بعد تأخير أربع ساعات.
# لذلك يبقى الكرون شبكة أمان، بينما يولّد كل تشغيلٍ الدورَ بعده بعد خمس عشرة دقيقة
# بالضبط. التتابع لا يعمل إلا إذا أضفت سرًّا للمستودع اسمه RELAY_TOKEN (مفتاح
# شخصي أدنى الصلاحيات: Actions:write على هذا المستودع وحده) — بدونه يسري الكرون وحده.
# NewsAPI يُستقصى في أول نافذة من كل ساعة فقط (48 طلبًا/يوم من حصة 100)، وبحث
# المحافظة مرة كل ست ساعات (~56 طلبًا/يوم في مجموعته). والتأخير الذي فوق يجعل النافذة
# تسقط أحيانًا، لذا يبقى input «force_newsapi» اليدوي لتخطيها عند الحاجة.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      section:
        description: "أي قسم يُحدَّث"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - local_news
          - world_news
          - sports
      dry_run:
        description: "طباعة ما سيُكتب دون الكتابة في القاعدة"
        required: false
        default: false
        type: boolean
      force_newsapi:
        description: "تجاوز نافذة NewsAPI الساعاتية (تشغيل يدوي فقط)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# cancel-in-progress=false: الإلغاء كان يمسك التشغيل المنتظر فيموت التتابع.
concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # نحو دقيقتي عمل + حتى ١٥ دقيقة انتظار للدور التالي.
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: جلب الخلاصات وكتابتها في items
        run: |
          ARGS="--section=${{ github.event.inputs.section || 'both' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force_newsapi }}" = "true" ]; then ARGS="$ARGS --force-newsapi"; fi
          node .github/scripts/sync-news.mjs $ARGS

      - name: توليد data/*.json من القاعدة
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node .github/scripts/publish.mjs
        env:
          DATA_DIR: data

      - name: commit ودفع إن تغيّر المحتوى
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "abubadawy-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "لا تغييرات في data — لا حاجة إلى commit."
            exit 0
          fi
          git commit -m "content: news sync (${{ github.run_number }})"
          # publish.yml قد يدفع في نفس اللحظة؛ إعادة try مع rebase بدل الفشل.
          for try in 1 2 3; do
            if git push; then break; fi
            echo "الدفع رفض (${try}/3) — rebase ثم إعادة المحاولة"
            git pull --rebase --autostash
            sleep $((try * 5))
          done

      - name: جدولة الدور التالي بعد ربع ساعة
        if: ${{ env.RELAY_TOKEN != '' && github.event.inputs.dry_run != 'true' }}
        env:
          SECTION: ${{ github.event.inputs.section || 'both' }}
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          NEXT=$(( (NOW / 900 + 1) * 900 ))
          echo "انتظار $((NEXT - NOW)) ثانية حتى حدّ الربع ساعة التالي"
          sleep "$((NEXT - NOW + 5))"
          # الكرون قد يرسل دوره في نفس الحدّ؛ الطابور يكتفي بواحد وإلا تراصّت الأدوار.
          QUEUED=$(curl -s -H "Authorization: Bearer $RELAY_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/news.yml/runs?status=queued&per_page=100" |
            node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>process.stdout.write(String((JSON.parse(s).total_count)||0)))')
          if [ "$QUEUED" != "0" ]; then
            echo "فيه $QUEUED تشغيل في الطابور — الكرون كفيل، لا نضيف دورًا."
            exit 0
          fi
          curl -sf -o /dev/null -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/news.yml/dispatches" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"section\":\"${SECTION}\"}}"
          echo "تمت جدولة الدور التالي."
