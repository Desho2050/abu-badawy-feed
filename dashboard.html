<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم محتوى قرية أبو بدوي</title>
<meta name="description" content="إدارة أقسام التطبيق وعناصره ووسائطه وأسعاره وقوانينه.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="side">
    <div class="brandrow">
      <img id="brandLogo" src="assets/logo.svg" alt="">
      <div>
        <b id="brandName">قرية أبو بدوي</b>
        <span id="brandTagline">لوحة التحكم بالمحتوى</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="لوحات التحكم"></nav>

    <section class="rail" aria-label="شريط الأقسام">
      <div class="railhead">
        <button type="button" class="iconbtn railtoggle" id="railToggle" aria-expanded="true"
          aria-controls="secnav" title="تصغير الأقسام"></button>
        <b class="railtitle">الأقسام</b>
        <span class="n" id="railTotal"></span>
      </div>
      <nav class="secnav" id="secnav"></nav>
    </section>

    <div class="who" id="who"></div>
  </aside>

  <main class="main">
    <div id="gate" class="card"></div>
    <div id="banner"></div>
    <div class="top">
      <div>
        <h1 id="panelTitle">لوحة التحكم</h1>
        <div class="sub" id="panelSub">…</div>
      </div>
      <div class="spacer"></div>
      <div class="btnrow" id="topActions"></div>
    </div>
    <div id="panel" class="main"></div>
  </main>
</div>

<div id="toastHost"></div>
<noscript><p style="padding:20px">لوحة التحكم تحتاج JavaScript. المحتوى العام متاح بدون scripting على index.html.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
